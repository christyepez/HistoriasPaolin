x-historiaspaolin-env: &historiaspaolin-env
  ASPNETCORE_ENVIRONMENT: Production
  SQLSERVER_HOST: sqlserver
  SQLSERVER_PORT: 1433
  SQLSERVER_DATABASE: ${HISTORIASPAOLIN_DATABASE:-HistoriasPaolinDb}
  SQLSERVER_USER: sa
  SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD}
  SQLSERVER_INTEGRATED_SECURITY: "false"
  SQLSERVER_ENCRYPT: "true"
  SQLSERVER_TRUST_SERVER_CERTIFICATE: "true"
  Jwt__Issuer: ${JWT_ISSUER:-portal-corporativo}
  Jwt__Audience: ${JWT_AUDIENCE:-portal-corporativo-clients}
  Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET}
  PORTAL_GATEWAY_BASE_URL: http://api-gateway:8080

services:
  historiaspaolin-migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    environment:
      <<: *historiaspaolin-env
    networks:
      - portal-local-network
    restart: "no"

  historiaspaolin-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *historiaspaolin-env
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      historiaspaolin-migrations:
        condition: service_completed_successfully
    networks:
      portal-local-network:
        aliases:
          - historiaspaolin-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  historiaspaolin-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *historiaspaolin-env
    depends_on:
      historiaspaolin-migrations:
        condition: service_completed_successfully
    networks:
      - portal-local-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep HistoriasPaolin.Worker | grep -v grep"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  portal-local-network:
    external: true
    name: portal-local-network
